name: CD - EC2 자동 배포

# CI 워크플로우가 master 브랜치에서 성공적으로 완료된 후에만 실행
on:
  workflow_run:
    workflows: ["CI - 테스트 자동화"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest

    # CI가 실패하면 배포하지 않음
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: SSH로 EC2 접속 후 deploy.sh 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/web-daw-backend
            bash scripts/deploy.sh

# ============================================================
# GitHub Secrets에 설정해야 할 값들:
#
# EC2_HOST     : EC2 퍼블릭 IP (예: 13.125.xxx.xxx)
# EC2_SSH_KEY  : web-daw-key.pem 파일의 전체 내용
#                (-----BEGIN RSA PRIVATE KEY----- 포함)
#
# 설정 위치: GitHub 저장소 → Settings → Secrets and variables
#            → Actions → New repository secret
# ============================================================
