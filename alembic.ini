[alembic]
# 마이그레이션 파일이 저장될 디렉토리
script_location = alembic

# 마이그레이션 파일 이름 형식: 001_create_users.py
file_template = %%(rev)s_%%(slug)s

# DATABASE_URL은 alembic/env.py에서 동적으로 읽어온다
# 여기서는 비워둔다
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
