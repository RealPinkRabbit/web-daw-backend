services:
  # ============================================================
  # FastAPI 앱 서버 (프로덕션 모드)
  # DB는 AWS RDS를 사용하므로 별도 db 서비스 없음
  # ============================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: web-daw-backend:latest
    container_name: webdaw-app
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
